name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Azure CLI
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      if: env.AZURE_CLIENT_ID != ''
    
    - name: Validate Bicep files
      run: |
        # Install Azure CLI if not present
        if ! command -v az &> /dev/null; then
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        
        # Check if Azure credentials are available
        if az account show &> /dev/null; then
          echo "Azure credentials configured, running full validation..."
          az bicep version
          az bicep build --file infra/main.bicep
          az bicep build --file infra/main-resources.bicep
          echo "✓ Bicep validation successful"
        else
          echo "⚠ Azure credentials not configured, skipping Azure CLI validation"
          echo "Note: Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID secrets for full validation"
        fi
    
    - name: Check Bicep file formatting
      run: |
        # Check if Bicep files are properly formatted
        for file in infra/*.bicep; do
          echo "Checking $file..."
          # Basic syntax validation
          grep -q "targetScope" "$file" || echo "⚠ No targetScope in $file"
        done
        echo "✓ Bicep formatting check complete"

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'dev' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: 
      name: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Azure credentials
      id: check_creds
      run: |
        if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
          echo "credentials_available=true" >> $GITHUB_OUTPUT
        else
          echo "credentials_available=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Azure Login
      if: steps.check_creds.outputs.credentials_available == 'true'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy Infrastructure
      run: |
        if [ "${{ steps.check_creds.outputs.credentials_available }}" == "true" ]; then
          echo "Deploying to Development environment..."
          az deployment sub create \
            --name psm-dev-deployment-$(date +%Y%m%d-%H%M%S) \
            --location westus2 \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters environmentName=dev
          echo "✓ Deployment successful"
        else
          echo "⚠ Azure deployment skipped - credentials not configured"
          echo "To enable deployment, configure the following secrets:"
          echo "  - AZURE_CLIENT_ID"
          echo "  - AZURE_TENANT_ID"
          echo "  - AZURE_SUBSCRIPTION_ID"
          echo ""
          echo "See DEPLOYMENT.md for setup instructions"
        fi

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'test'
    environment: 
      name: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Azure credentials
      id: check_creds
      run: |
        if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
          echo "credentials_available=true" >> $GITHUB_OUTPUT
        else
          echo "credentials_available=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Azure Login
      if: steps.check_creds.outputs.credentials_available == 'true'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy Infrastructure
      run: |
        if [ "${{ steps.check_creds.outputs.credentials_available }}" == "true" ]; then
          echo "Deploying to Test environment..."
          az deployment sub create \
            --name psm-test-deployment-$(date +%Y%m%d-%H%M%S) \
            --location westus2 \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters environmentName=test
          echo "✓ Deployment successful"
        else
          echo "⚠ Azure deployment skipped - credentials not configured"
          echo "Configure Azure secrets to enable deployment (see DEPLOYMENT.md)"
        fi

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'prod'
    environment: 
      name: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Azure credentials
      id: check_creds
      run: |
        if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
          echo "credentials_available=true" >> $GITHUB_OUTPUT
        else
          echo "credentials_available=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Azure Login
      if: steps.check_creds.outputs.credentials_available == 'true'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy Infrastructure
      run: |
        if [ "${{ steps.check_creds.outputs.credentials_available }}" == "true" ]; then
          echo "Deploying to Production environment..."
          az deployment sub create \
            --name psm-prod-deployment-$(date +%Y%m%d-%H%M%S) \
            --location westus2 \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters environmentName=prod
          echo "✓ Deployment successful"
        else
          echo "⚠ Azure deployment skipped - credentials not configured"
          echo "Configure Azure secrets to enable deployment (see DEPLOYMENT.md)"
        fi
