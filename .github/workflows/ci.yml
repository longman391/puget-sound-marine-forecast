name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt
    
    - name: Run type checking
      run: |
        mypy src/ --ignore-missing-imports
    
    - name: Run linting
      run: |
        black --check src/ tests/
        ruff check src/ tests/
    
    - name: Run security checks - secrets scanning
      run: |
        pip install gitleaks || echo "Gitleaks not available via pip, skipping"
        # Alternative: use detect-secrets
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline || echo "Creating baseline"
        detect-secrets scan --exclude-files '.*\.pyc$' --exclude-files '^\.git/' || true
    
    - name: Run security checks - dependency vulnerabilities
      run: |
        pip-audit --desc --skip-editable
      continue-on-error: true
    
    - name: Run tests with coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=55
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Check environment configuration
      run: |
        # Verify .env.example exists and has required keys
        if [ -f .env.example ]; then
          echo "✓ .env.example found"
          grep -q "API_TITLE" .env.example && echo "✓ API_TITLE configured"
          grep -q "HOST" .env.example && echo "✓ HOST configured"
          grep -q "PORT" .env.example && echo "✓ PORT configured"
        else
          echo "⚠ .env.example not found"
        fi
